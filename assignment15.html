<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 15</title>
</head>
<body>
    <fieldset>
        <legend>Personal Details</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" aria-label="Name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" aria-label="Email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" aria-label="Password" required>
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" aria-label="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" aria-label="Female">
        <label for="female">Female</label>
        <br><br>
        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" id="reading" name="hobbies" value="reading" aria-label="Reading">
        <label for="reading">Reading</label>
        <input type="checkbox" id="coding" name="hobbies" value="coding" aria-label="Coding">
        <label for="coding">Coding</label>
        <br><br>
        <label for="dateofbirth">DOB:</label>
        <input type="date" id="dateofbirth" name="dateofbirth" aria-label="Date of Birth" required>

    </fieldset>

        <p>&copy; 2026 Made by 𝑯𝒆𝒓𝒐&lt;/&gt;. All rights reserved.</p>
    </footer>
    </body>
</html>
